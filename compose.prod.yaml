# This is an example of how to run the app in production using the image from
# the GitHub Container registry.

name: spill-the-tea

services:
  server:
    image: "ghcr.io/ASmaller/spill-the-tea:latest"
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:<DATABASE PASSWORD>@db:5432/spill-the-tea
      JWT_SECRET: <REPLACE ME>
      GAMMA_CLIENT_SECRET: <REPLACE ME>
      GAMMA_CLIENT_ID: <REPLACE ME>
      GAMMA_API_KEY_ID: <REPLACE ME>
      GAMMA_API_KEY_SECRET: <REPLACE ME>

    ports:
      - "3000:3000"

    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18
    restart: always
    user: postgres
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=spill-the-tea
      - POSTGRES_PASSWORD=<DATABASE PASSWORD>
    expose:
      - 5432
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db-data:
